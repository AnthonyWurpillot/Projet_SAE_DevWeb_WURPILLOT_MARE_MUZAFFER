
<!-- TOUITE DETAILLE - TWEETDETAILRENDERER (valeurs d'exemple à remplacer par php)-->

<article class="tweet-detail">

    <!-- Auteur et bouton suivre -->
    <div class="detail-header">
        <span class="tweet-author">@alice</span>
        <button type="button" class="follow-button">Suivre</button>
    </div>

    <!-- Texte complet (exemple)-->
    <p class="detail-text">
        Aujourd'hui, je découvre Touiteur !
        Hâte de voir ce que cette plateforme va donner.

        C'est vraiment intéressant de pouvoir partager
        ses idées avec toute une communauté.

        #BUTInfo #DéveloppementWeb
    </p>

    <!-- Image facultative (condition à gérer en php)-->
    <div class="detail-image">
        <img src="../images/tweet-example.jpg" alt="Image associée au touite">
    </div>

    <!-- Note et date -->
    <div class="detail-footer">
        <div class="vote-controls">
            <button type="button" class="vote-button" aria-label="Upvote">▲</button>
            <span class="tweet-score">12</span>
            <buttontype="button" class="vote-button" aria-label="Downvote">▼</button>
        </div>
        <div class="tweet-date">03/11/26 à 14:30</div>
    </div>
</article>
